              session.date === day &&
              Number(session.period) === Number(period),
          )
          .sort(
            (left, right) =>
              Number(left.group_index) - Number(right.group_index),
          );
        if (calendarViewMode !== "availability") {
          for (const session of slotSessions) {
            cell.appendChild(createSessionSummary(session));
          }
        }
        if (
          calendarViewMode !== "availability" &&
          !isExcludedDay(day) &&
          slotSessions.length < Number(args.max_groups_per_slot || 1)
        ) {
          const add = buttonWithText("＋", "add-session");
          add.title = `${day} ${period}限に組を追加`;
          add.setAttribute(
            "aria-label",
            `${day} ${period}限に組を追加`,
          );
          add.addEventListener("click", () => addSession(day, period));
          cell.appendChild(add);
        }
        if (calendarViewMode === "availability") {
          cell.appendChild(createAvailabilityPreview(day, period));
        }
        return cell;
      }

      function createIssueList(session) {
        const issues = sessionIssues(session);

        list.className = "issue-list";
        for (const issue of issues) {

        identity.className = "member-name-wrap";

        name.className = "member-name";
        name.textContent = participantName(participantId);
        identity.appendChild(name);
        const note = document.createElement("span");
        note.className = `member-note${canAttend ? "" : " warning"}`;
        note.textContent = canAttend
          ? !showOptimizationControls() || !showDateLockControls()
            ? "参加可能回答内"
            : wholeSessionLocked
            ? "日時維持"
            : isLocked
            ? "日時維持"

          : "🔓日時自由";

      function createParticipantPicker(session) {
        const details = document.createElement("details");
        details.className = "participant-picker";
        const pickerSessionId = String(session.session_id);
        const restoreOpen =
          participantPickerOpen &&
          participantPickerSessionId === pickerSessionId;
        const summary = document.createElement("summary");
        summary.textContent = "＋ 追加できる参加者";
        details.appendChild(summary);
        const body = document.createElement("div");
        body.className = "picker-body";
        const search = document.createElement("input");
        search.type = "search";
        search.className = "participant-search";
        search.placeholder = "名前で検索";
        search.setAttribute(
          "aria-label",
          "このコマへ追加する参加者を検索",
        );
        if (restoreOpen) {
          search.value = participantPickerQuery;
        }
        body.appendChild(search);
        const options = document.createElement("div");
        options.className = "participant-options";
        body.appendChild(options);
        details.appendChild(body);

        const participants = Object.values(participantsById)
          .filter(
            (participant) =>
              !participantSelectionBlockReason(session, participant.id),
          )
          .sort((left, right) =>
            String(left.name).localeCompare(String(right.name), "ja"),
          );
        const renderOptions = () => {
          const query = String(search.value || "")
            .trim()
            .toLocaleLowerCase("ja");
          options.replaceChildren();
          const visible = participants.filter((participant) =>
            String(participant.name)
              .toLocaleLowerCase("ja")
              .includes(query),
          );
          if (!visible.length) {
            const empty = document.createElement("p");
            empty.className = "empty-message";
            empty.textContent = query
              ? "検索条件に一致する追加可能な参加者はいません。"
              : "この日時・開催形式で追加できる参加者はいません。";
            options.appendChild(empty);
            return;
          }
          for (const participant of visible) {
            const option = document.createElement("div");
            option.className = "participant-option";
            const text = document.createElement("div");
            const name = document.createElement("span");
            name.className = "participant-option-name";
            name.textContent = String(participant.name);
            text.appendChild(name);
            const reason = document.createElement("span");
            reason.className = "participant-option-reason available";
            reason.textContent = `参加可能：${participantAttendanceKinds(
              participant,
              session.date,
              session.period,
            ).join("・")}`;
            text.appendChild(reason);
            option.appendChild(text);
            const add = buttonWithText("＋追加");
            add.title = "このコマの参加者へ追加";
            add.addEventListener("click", () =>
              addParticipant(session, participant.id),
            );
            option.appendChild(add);
            options.appendChild(option);
          }
        };
        search.addEventListener("input", () => {
          participantPickerQuery = search.value;
          renderOptions();
        });
        details.addEventListener("toggle", () => {
          if (details.open) {
            participantPickerOpen = true;
            participantPickerSessionId = pickerSessionId;
            participantPickerQuery = search.value;
            renderOptions();
            window.setTimeout(setFrameHeight, 0);
          } else if (participantPickerSessionId === pickerSessionId) {
            participantPickerOpen = false;
            participantPickerSessionId = "";
            participantPickerQuery = "";
          }
        });
        if (restoreOpen) {
          details.open = true;
          renderOptions();
        }
        return details;
      }

        name.textContent = participantName(participantId);
        nameLine.appendChild(name);
        const previousRole = (
          session.display_university_role_member_ids || []
        ).includes(String(participantId))

        const actions = document.createElement("div");

        roleActions.className = "member-role-actions";
        for (const role of ["high_school", "university"]) {
          const config = roleConfig(role);
          const active = (session[config.field] || []).includes(
            String(participantId),
          );
          const roleButton = buttonWithText(
            config.label,
            "member-role-toggle",
          );
          roleButton.classList.toggle("active", active);
          roleButton.setAttribute("aria-pressed", active ? "true" : "false");
          roleButton.setAttribute(
            "aria-label",
            active
              ? `${participantName(participantId)}さんの${config.label}を解除`
              : `${participantName(participantId)}さんを${config.label}に指定`,
          );
          roleButton.title = active
            ? `${config.label}を解除`
            : `${config.label}に指定`;
          roleButton.addEventListener("click", () =>

          roleActions.appendChild(roleButton);

        actions.appendChild(roleActions);

          session.locked_participant_member_ids || []

        if (showDateLockControls()) {
          const lock = buttonWithText("", "chip-action");
          lock.textContent = wholeSessionLocked || isLocked
          ? "🔒日時維持"
          : "🔓日時自由";
          lock.classList.toggle("locked", isLocked || wholeSessionLocked);
          lock.disabled = wholeSessionLocked;
          lock.title = wholeSessionLocked
          ? "このコマは日時維持中"
          : isLocked
          ? "日時維持を解除"
          : "この参加者の日時を維持";
          lock.addEventListener("click", () =>
            toggleMemberLock(
              session,
              "university_role_member_ids",
              participantId,
            ),
          );
          actions.appendChild(lock);
        }

        const remove = buttonWithText("×外す", "chip-action danger");
        remove.title = "このコマの参加者から外す";
        remove.addEventListener("click", () =>
          removeParticipant(session, participantId),
        );
        actions.appendChild(remove);
        row.appendChild(actions);

        const undoButton = buttonWithText("↶ 取り消す");
        undoButton.disabled = !undoStack.length;
        undoButton.title = undoStack.length
          ? `「${undoStack[undoStack.length - 1].label}」を取り消す`
          : "取り消せる操作はありません";
        undoButton.addEventListener("click", undo);
        historyActions.appendChild(undoButton);
        const redoButton = buttonWithText("↷ やり直す");
        redoButton.disabled = !redoStack.length;
        redoButton.title = redoStack.length
          ? `「${redoStack[redoStack.length - 1].label}」をやり直す`
          : "やり直せる操作はありません";
        redoButton.addEventListener("click", redo);
        historyActions.appendChild(redoButton);
        const resetButton = buttonWithText("初期状態に戻す");
        resetButton.disabled = !isDirty();
        resetButton.addEventListener("click", resetToInitial);
        historyActions.appendChild(resetButton);
        toolbar.appendChild(historyActions);

        const lockActions = document.createElement("div");
        lockActions.className = "toolbar-group";
        const lockAll = buttonWithText("全コマを固定");
        lockAll.title =
          "現在の日時を探索でも維持";
        lockAll.addEventListener("click", () => setAllLocks(true));
        lockActions.appendChild(lockAll);
        const unlockAll = buttonWithText("固定を解除");
        unlockAll.title =
          "日時・役割を探索に任せる";
        unlockAll.addEventListener("click", () => setAllLocks(false));
        lockActions.appendChild(unlockAll);
        if (showDateLockControls() && calendarViewMode !== "availability") {
          toolbar.appendChild(lockActions);
        }

        const spacer = document.createElement("span");
        spacer.className = "toolbar-spacer";
        toolbar.appendChild(spacer);

        const dirty = document.createElement("span");
        dirty.className = `status-pill${isDirty() ? " dirty" : ""}`;
        dirty.textContent = isDirty()
          ? `変更中${undoStack.length ? `（${undoStack.length}操作）` : ""}`
          : "変更なし";
        if (lastActionMessage) {
          dirty.title = lastActionMessage;
        }
        toolbar.appendChild(dirty);

        const session = currentSession();
        if (session && calendarViewMode !== "availability") {
          const selected = document.createElement("span");
          selected.className = "status-pill selected";
          selected.textContent =
            `選択中: ${session.date} ${session.period}限 組` +
            session.group_index;
          toolbar.appendChild(selected);
        }

        const issues = allIssues();
        const warning = document.createElement("span");
        const hasError = issues.some(
          (issue) => issue.severity === "error",
        );
        warning.className = `status-pill ${
          hasError ? "error" : issues.length ? "warning" : ""
        }`;
        warning.textContent = issues.length
          ? `警告・要修正 ${issues.length}件`
          : "画面上の警告なし";
        toolbar.appendChild(warning);
        return toolbar;
      }

      function captureScrollPositions(root) {
        const calendar = root.querySelector(".calendar-wrap");
        if (calendar) {
          calendarScrollPosition = {
            left: calendar.scrollLeft,
            top: calendar.scrollTop,
          };
        }
        const detail = root.querySelector(".detail-panel");
        if (detail) {
          detailScrollTop = detail.scrollTop;
        }
        const participantPicker = root.querySelector(
          ".participant-picker",
        );
        if (participantPicker) {
          participantPickerOpen = participantPicker.open;
          participantPickerSessionId = selectedSessionId;
          const search = participantPicker.querySelector(
            ".participant-search",
          );
          participantPickerQuery = search ? search.value : "";
        }
      }

      function restoreScrollPositions(root) {
        const restore = () => {
          const calendar = root.querySelector(".calendar-wrap");
          if (calendar) {
            calendar.scrollLeft = calendarScrollPosition.left;
            calendar.scrollTop = calendarScrollPosition.top;
          }
          const detail = root.querySelector(".detail-panel");
          if (detail) {
            detail.scrollTop = detailScrollTop;
          }
        };
        restore();
        window.requestAnimationFrame(restore);
      }

      function render() {
        const root = document.getElementById("root");
        captureScrollPositions(root);
        root.replaceChildren();
        const guide = document.createElement("div");
        guide.className = "operation-guide";
        const guideTitle = document.createElement("strong");
        guideTitle.textContent = "カレンダー操作";
        guide.appendChild(guideTitle);
        const guideSteps = document.createElement("span");
        guideSteps.textContent =
          calendarViewMode === "availability"
            ? "参加可能者: 名前で参加・離脱。大／高で役割を指定。形式は自動。"
            : showOptimizationControls() && !showDateLockControls()
            ? "指定した参加者を指定した日時の組に追加します。"
            : showOptimizationControls()
            ? "概要: 参加者を選び、役割・形式を指定します。"
            : "概要: 参加者を選び、役割・形式を指定します。";
        guide.appendChild(guideSteps);
        const guideNote = document.createElement("small");
        guideNote.textContent =
          calendarViewMode === "availability"
            ? "黄色＝参加 / 白＝未指定 / 水色＝指定。"
            : showOptimizationControls() && !showDateLockControls()
            ? "指定した参加者・日時を固定して探索します。役割は指定すると固定されますが、指定しなくても探索できます。"
            : showOptimizationControls()
            ? "白＝未指定 / 水色＝指定 / 日時維持＝そのコマを残す。"
            : "白＝未指定 / 水色＝指定。";
        guide.appendChild(guideNote);
        root.appendChild(guide);
        root.appendChild(createToolbar());

        const layout = document.createElement("div");
        layout.className = `editor-layout${
          currentSession() && calendarViewMode !== "availability"
            ? " has-detail"
            : ""
        }`;
        layout.appendChild(createCalendarPane());
        if (currentSession() && calendarViewMode !== "availability") {
          layout.appendChild(createDetailPanel());
        }
        root.appendChild(layout);
        restoreScrollPositions(root);
        window.setTimeout(setFrameHeight, 0);
      }

      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "streamlit:render") {
          return;
        }
        initializeState(event.data.args || {});
        render();
      });

      setComponentReady();
      observeFrameHeight();
    </script>
  </body>
</html>
